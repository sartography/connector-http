name: Docker Image CI

on:
  push:
    branches: [ "release/**" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Extract release tag
      id: vars
      run: echo "release_tag=${GITHUB_REF##*/}" >> $GITHUB_ENV

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/bueckendorf-it/spiff-webhooks:${{ env.release_tag }}

    - name: Push the Docker image
      run: docker push ghcr.io/bueckendorf-it/spiff-webhooks:${{ env.release_tag }}
